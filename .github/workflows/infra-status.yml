name: Infra status

on:
  workflow_dispatch:
  push:
    paths:
      - "infrastructure/**"
      - ".github/workflows/infra-status.yml"

permissions:
  contents: read
  id-token: write

jobs:
  report-url:
    name: Report App Runner URL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/env/dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Terraform init + output
        id: tf
        run: |
          terraform init -reconfigure -input=false
          {
            echo "### Signalfold infra"
            echo ""
            echo '```'
            terraform output || true
            echo '```'
            echo ""
            URL="$(terraform output -raw service_url 2>/dev/null || true)"
            if [ -n "$URL" ] && [ "$URL" != "null" ]; then
              echo "**App URL:** $URL"
              echo "::notice title=App Runner URL::$URL"
              echo "APP_URL=$URL" >> "$GITHUB_ENV"
            else
              echo "**App URL:** not deployed yet (\`enable_apprunner\` false or apply not run)."
              echo "::notice title=App Runner URL::Not deployed yet"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
