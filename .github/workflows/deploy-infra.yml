# Deploy via infrastructure/justfile — keep Terraform choreography out of this file.
name: Deploy Infra

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/**"
      - "web/**"
      - ".github/workflows/deploy-infra.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1

jobs:
  deploy-dev:
    name: Deploy Dev
    runs-on: ubuntu-latest
    outputs:
      app_url: ${{ steps.summary.outputs.app_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false

      - name: Setup just
        uses: extractions/setup-just@v2

      - name: Check infra format
        working-directory: infrastructure
        run: just fmt-check

      - name: Lint infra
        working-directory: infrastructure
        run: just lint

      - name: Deploy
        working-directory: infrastructure
        run: just deploy "${{ github.sha }}"

      - name: Publish App URL
        id: summary
        working-directory: infrastructure
        run: |
          URL="$(cd env/dev/app && terraform output -raw service_url)"
          echo "app_url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "### noise-to-signal (CloudFront)"
            echo ""
            echo "**App URL:** $URL"
            echo ""
            echo "Use this host for Google OAuth origin + redirect URI."
            echo ""
            echo '```'
            cd env/dev/app && terraform output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=App URL (CloudFront)::$URL"
