# OIDC via AWS_ROLE_ARN secret + terraform + image push + Function URL notice.
name: Deploy Infra

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/**"
      - "web/**"
      - ".github/workflows/deploy-infra.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1

jobs:
  deploy-dev:
    name: Deploy Dev
    runs-on: ubuntu-latest
    outputs:
      app_url: ${{ steps.urls.outputs.app_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false

      - name: Setup just
        uses: extractions/setup-just@v2

      - name: Check infra format
        working-directory: infrastructure
        run: just fmt-check

      - name: Lint infra
        working-directory: infrastructure
        run: just lint

      # Phase 1: ECR + app secret (Google OAuth lives in noise-to-signal/dev/google-oauth — console-managed)
      - name: Apply infra (ECR + secrets)
        working-directory: infrastructure/env/dev
        run: |
          terraform init -reconfigure -input=false
          terraform apply -auto-approve -input=false -lock-timeout=5m \
            -var="enable_lambda=false"

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        working-directory: infrastructure
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          just push-image "${IMAGE_TAG}"
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Apply infra (enable Lambda)
        working-directory: infrastructure/env/dev
        run: |
          terraform apply -auto-approve -input=false -lock-timeout=5m \
            -var="enable_lambda=true" \
            -var="image_tag=${{ steps.image.outputs.tag }}"

      - name: Set public_hostname from Function URL
        working-directory: infrastructure/env/dev
        run: |
          URL="$(terraform output -raw service_url)"
          HOST="${URL#https://}"
          HOST="${HOST%/}"
          terraform apply -auto-approve -input=false -lock-timeout=5m \
            -var="enable_lambda=true" \
            -var="image_tag=${{ steps.image.outputs.tag }}" \
            -var="public_hostname=${HOST}"

      - name: Migrate and seed via Lambda invoke
        working-directory: infrastructure
        run: just setup-remote

      - name: Publish App URL
        id: urls
        working-directory: infrastructure/env/dev
        run: |
          URL="$(terraform output -raw service_url)"
          echo "app_url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "### noise-to-signal Lambda"
            echo ""
            echo "**App URL:** $URL"
            echo ""
            echo '```'
            terraform output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Function URL::$URL"
          echo "APP_URL=$URL"
