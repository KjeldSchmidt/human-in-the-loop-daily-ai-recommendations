{% extends "base.html" %}
{% block title %}Answer{% endblock %}
{% block content %}
<section class="narrow">
  <h1>Taste check</h1>
  <p class="lede">{{ question.prompt }}</p>
  <form method="post" class="stack">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn primary">Save answer</button>
    <a class="btn ghost" href="{% url 'followups' %}">Cancel</a>
  </form>
</section>
{% endblock %}
